# 부산온나우 인스타그램 자동화 설정 파일
# 코드를 몰라도 이 파일만 고치면 게시 요일·말투·디자인·답글 방식을 바꿀 수 있습니다.

[account]
brand = "부산온나우"          # 카드 하단에 들어가는 계정 이름
persona = "부산의 공연·전시·축제와 지역 소식을 알려 주는 '부산온나우(부산온나)' 계정"
audience = "부산 시민, 부산 여행을 계획하는 사람, 주말 나들이를 찾는 20~40대"
tone = """친근한 부산 친구 말투. '~하나?', '~데이', '가보자!', '온나~'처럼 부산 사투리를 문장당 한두 군데만 가볍게 섞고,
정보(날짜·장소·가격)는 표준어로 정확하게. 이모지는 문단당 1~2개."""

[schedule]
# 자동화 전체 켜기/끄기. false면 15분마다 도는 예약 실행이 아무것도 하지 않음(수동 실행은 가능)
enabled = false
# 릴스(공연·축제·전시): 기준일부터 이틀 간격으로 게시
reels_anchor = "2026-11-18"     # 첫 릴스 게시일 (이 날부터 interval_days 간격)
reels_interval_days = 2
reels_time = "19:20"
reels_draft_days_before = 3     # 게시 며칠 전에 초안을 만들지
reels_reminder_time = "15:00"   # 게시 당일, 영상이 없으면 이 시각에 텔레그램 안내
# 부산 뉴스 카드: 요일·시간 고정, 전날 밤에 초안
news_days = ["mon", "wed", "fri"]
news_time = "08:00"
news_draft_time = "20:00"       # 게시 전날 이 시각에 초안
# 주간 릴스 기획표
plan_day = "mon"
plan_time = "07:00"
plan_horizon_days = 14

[reels]
max_video_seconds = 45          # 직접 찍은 영상은 최대 이 길이까지 사용
slide_seconds = 18              # 사진 슬라이드 릴스 길이
max_slides = 7

[event]
lookahead_days = 14           # 오늘부터 며칠 안에 진행되는 행사를 후보로 볼지
kopis_region = "26"           # KOPIS 지역코드 (26 = 부산광역시)
tourapi_region = "26"         # TourAPI 법정동 시도코드 (26 = 부산광역시)

[content]
fixed_hashtags = ["#부산온나우", "#부산가볼만한곳", "#부산데이트"]
max_hashtags = 15

[design]
background = "#F4F8FB"        # 바탕 (옅은 하늘색)
primary = "#0B4F8A"           # 제목·강조 (바다 파랑)
accent = "#FF7A59"            # 포인트 (노을 코랄)
text = "#1F2933"
# 표지(기존 부산온나우 스타일): 사진 전체 배경 + 'ON NOW · 분류' + 두 줄 큰 제목(둘째 줄 색 강조)
cover_tag = "ON NOW"
cover_badge = "BUSAN ON NOW"
badge_color = "#0B2A5B"
# 분류별 강조색 (표지 둘째 줄 제목·분류 글자)
category_colors = { "공연" = "#FF6FAE", "축제" = "#FFD43B", "전시" = "#4ADE80", "뉴스" = "#5BC0FF", "기타" = "#FFA94D" }
# 제목 글꼴: fonts 폴더에 글꼴 파일(.ttf/.otf)을 올리고 파일 이름을 적으면 그 글꼴 사용 (비우면 Noto Sans KR Black)
headline_font = ""

[reply]
# "draft" = 답글 초안만 만들어 GitHub 실행 기록에 보여 줌 (처음 2~3주 추천)
# "auto"  = 실제로 답글을 자동 등록
mode = "draft"
recent_posts = 10
max_age_days = 7
max_replies_per_run = 15
manual_keywords = ["취소", "환불", "항의", "신고", "잘못", "틀렸", "광고 문의", "협찬", "연락처"]

[ai]
model = "claude-opus-5-5"
post_effort = "high"
reply_effort = "low"

[instagram]
api_version = "v23.0"

[hosting]
method = "github"
