# 인스타그램 자동화 설정 파일
# 코드를 몰라도 이 파일만 고치면 주제·말투·디자인·답글 방식을 바꿀 수 있습니다.

[account]
# 계정 소개 (AI가 글을 쓸 때 참고합니다)
persona = "초등학교 현직 교사가 운영하는 교육·학급경영 정보 계정"
audience = "초등 교사, 예비 교사, 초등 자녀를 둔 학부모"
tone = "친근하고 따뜻한 존댓말. 선배 선생님이 옆에서 알려주듯 쉽고 구체적으로. 이모지는 문단당 1개 이내."
handle = "@your_handle"   # 카드 하단에 들어갈 계정 이름 (실제 아이디로 바꿔 주세요)

[content]
# AI가 이 중에서 시기에 맞는 주제를 골라 씁니다. 자유롭게 추가·삭제하세요.
topic_pool = [
  "학급 규칙 세우기와 학기 초 루틴",
  "아침 활동·자투리 시간 활용법",
  "칭찬·보상 시스템 운영 팁",
  "학부모 상담 준비와 소통 요령",
  "교실 갈등 상황 대처법",
  "모둠 활동·협동 학습 운영",
  "학급 행사(생일·학기말·방학식) 아이디어",
  "교사 업무 효율화·AI 활용 팁",
  "독서 습관 기르기 활동",
  "계절·절기별 계기 교육 아이디어",
]
slide_count = 4               # 표지·마무리를 뺀 본문 카드 수 (3~6 권장)
fixed_hashtags = ["#초등교사", "#학급경영", "#교사스타그램"]
max_hashtags = 12             # 고정 해시태그 포함 최대 개수

[design]
# 카드뉴스 색상 (16진수 색상 코드)
background = "#FFF8EC"
primary = "#2F5D50"           # 제목·강조색
accent = "#F2A541"            # 포인트(번호 배지 등)
text = "#2B2B2B"

[reply]
# "draft" = 답글 초안만 만들어 GitHub 실행 기록에 보여 줌 (처음 2~3주 추천)
# "auto"  = 실제로 답글을 자동 등록
mode = "draft"
recent_posts = 10             # 최근 몇 개 게시물의 댓글을 확인할지
max_age_days = 7              # 며칠 지난 댓글까지 답할지
max_replies_per_run = 15      # 한 번 실행에 최대 답글 수
# 이 단어가 들어간 댓글은 자동 답글을 하지 않고 '직접 확인 필요'로 표시
manual_keywords = ["민원", "신고", "고소", "환불", "연락처", "전화번호", "카톡", "학교 이름"]

[ai]
model = "claude-opus-5-5"
post_effort = "high"          # 게시물 생성: 품질 우선
reply_effort = "low"          # 댓글 답글: 짧고 빠르게

[instagram]
api_version = "v23.0"         # Meta 그래프 API 버전 (Meta가 구버전을 종료하면 올려 주세요)

[hosting]
# Instagram은 이미지 '공개 주소(URL)'만 받습니다.
# "github"     = 이 저장소에 이미지를 올리고 그 주소를 사용 (저장소가 공개(Public)여야 함)
# "cloudinary" = Cloudinary 무료 계정에 업로드 (저장소를 비공개로 두고 싶을 때)
method = "github"
