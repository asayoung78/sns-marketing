name: 부산온나우 게시물 자동 업로드

on:
  schedule:
    - cron: "20 10 * * *"   # 매일 19:20 (한국 시간). GitHub 사정으로 몇 분~수십 분 늦을 수 있음
  workflow_dispatch:         # Actions 탭에서 수동 실행
    inputs:
      kind:
        description: "게시물 종류 (비우면 요일표대로)"
        type: choice
        options: ["", "event", "exhibit", "news"]
        default: ""
      topic:
        description: "행사명·주제 직접 지정 (선택)"
        required: false
        default: ""
      dry_run:
        description: "미리보기만 (게시하지 않고 이미지만 생성)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-post

jobs:
  # 인스타 토큰이 아직 없으면 예약 실행을 건너뛴다 (AI 비용 낭비 방지). 미리보기는 항상 실행.
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ] || [ -n "$IG_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::IG_ACCESS_TOKEN이 아직 없어 게시를 건너뜁니다. 미리보기는 Run workflow로 실행하세요."
          fi

  post:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
      TOURAPI_KEY: ${{ secrets.TOURAPI_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: 한글 글꼴 설치
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk fonts-noto-cjk-extra
      - run: pip install -r requirements.txt

      - name: 원고 작성 + 카드뉴스 생성
        env:
          KIND: ${{ inputs.kind }}
          TOPIC: ${{ inputs.topic }}
        run: python -m insta_auto.generate --kind "$KIND" --topic "$TOPIC"

      - name: 미리보기 이미지 첨부
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v6
        with:
          name: preview
          path: media/

      - name: 이미지 커밋 (공개 주소 만들기)
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "insta-bot"
          git config user.email "insta-bot@users.noreply.github.com"
          git add media data/pending.json
          git commit -m "카드뉴스 이미지 생성"
          git pull --rebase -q && git push

      - name: 인스타그램 게시
        if: ${{ !inputs.dry_run }}
        run: python -m insta_auto.publish

      - name: 게시 기록 저장
        if: ${{ !inputs.dry_run }}
        run: |
          git add -A data
          git commit -m "게시 기록 업데이트"
          git pull --rebase -q && git push
