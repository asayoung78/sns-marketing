name: 인스타 토큰 자동 연장

on:
  schedule:
    - cron: "13 3 1,15 * *"   # 매월 1일·15일 (토큰 유효기간 60일)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 토큰 연장
        run: python -m insta_auto.refresh_token "$RUNNER_TEMP/token.txt"
      - name: GitHub Secret 갱신
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "::add-mask::$(cat "$RUNNER_TEMP/token.txt")"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/token.txt"
          rm -f "$RUNNER_TEMP/token.txt"
