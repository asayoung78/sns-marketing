name: 댓글 자동 답글

on:
  schedule:
    - cron: "7 22-23,0-14 * * *"   # 한국 시간 07시~23시, 매시 7분
  workflow_dispatch:
    inputs:
      mode:
        description: "draft = 초안만 보기, auto = 실제 등록 (비우면 settings.toml 값)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: instagram-reply

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      REPLY_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m insta_auto.reply
