name: 부산온나우 자동화 (초안·알림·게시)

# 15분마다 '지금 할 일'을 확인: 주간 기획표, 릴스 초안(3일 전), 뉴스 초안(전날 밤), 당일 안내, 승인된 초안 게시
# AI 비용은 초안을 만들 때만 든다(할 일이 없으면 0원).
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "실행할 작업 (all = 지금 할 일 모두)"
        type: choice
        options: ["all", "plan", "reel_drafts", "news_drafts", "reminders", "publish"]
        default: "all"
      force:
        description: "기획표를 요일·시간과 상관없이 지금 만들기 (task=plan일 때)"
        type: boolean
        default: false

permissions:
  contents: write   # media-store 브랜치에 미디어 저장
  issues: write     # 초안 만들기·댓글

concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: src
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
      TOURAPI_KEY: ${{ secrets.TOURAPI_KEY }}
      GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: 글꼴·영상 도구 설치
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk fonts-noto-cjk-extra ffmpeg
      - run: pip install -r requirements.txt
      - name: 지금 할 일 처리
        env:
          TASK: ${{ inputs.task || 'all' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python -m insta_auto.scheduler --task "$TASK" $FORCE
